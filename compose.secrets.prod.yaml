# Production secrets overlay for projektveckor-portal.
# Pass this file only on the deploy, recreate and one-off run paths through
# `pdm run prod-compose` (agent-secrets run --set projektveckor-portal-prod),
# which injects the secret values into the process environment.
# ps, logs, stop, config, exec and boot paths use compose.prod.yaml alone.

services:
  web:
    environment:
      SIR_CONVERT_A_LOT_V2_API_KEY: ${SIR_CONVERT_A_LOT_V2_API_KEY:?run through pdm run prod-compose}
