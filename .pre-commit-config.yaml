repos:
  - repo: local
    hooks:
      - id: docs-validate
        name: Validate governed documentation
        entry: pdm run docs-validate
        language: system
        files: ^docs/.*\.(md|yaml)$
        pass_filenames: false
      - id: skills-validate
        name: Validate local skills
        entry: pdm run skills-validate
        language: system
        files: ^\.codex/skills/
        pass_filenames: false
      - id: handoff-validate
        name: Validate handoff
        entry: pdm run handoff-validate
        language: system
        files: ^(handoff\.md|\.codex/(readme-first|handoff)\.md)$
        pass_filenames: false
  - repo: local
    hooks:
      - id: markdown-format
        name: Markdown format (staged Markdown files)
        entry: pdm run format-md
        language: system
        types: [markdown]
        exclude: ^docs/(index\.md|(backlog|decisions|reference|runbooks)/INDEX\.md)$
        pass_filenames: true
