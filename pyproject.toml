[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "projektveckor-portal"
version = "0.1.0"
description = "Teacher-first project-week portal hosted on hule.education (FastAPI + Vue/Vite)."
authors = [{ name = "Olof Larsson", email = "paunchygent@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "markdown",
  "httpx",
  "dishka",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "types-PyYAML",
  "types-Markdown",
  "pre-commit>=4.3,<5",
]

[tool.repository-governance]
schema-version = 3
repository = "projektveckor-portal"

[tool.repository-governance.owners]
domain = ["projektveckor-portal"]

[tool.repository-governance.setup]
projects = [{ path = ".", groups = ["default", "dev"] }]

[tool.repository-governance.quality]
projects = [
  { path = ".", format = ["src", "scripts", "tests"], lint = ["src", "scripts", "tests"], typecheck-diagnostic-producer = "root-typecheck", test-diagnostic-producer = "root-test" },
]
producers = [
  { name = "root-typecheck", intent = "typecheck", project = ".", command = "typecheck-producer", arguments = [] },
  { name = "root-test", intent = "test", project = ".", command = "test-producer", arguments = [] },
]
validators = [
  { name = "docs-validate", project = ".", command = "docs-validate", arguments = [] },
  { name = "skills-validate", project = ".", command = "skills-validate", arguments = [] },
  { name = "handoff-validate", project = ".", command = "handoff-validate", arguments = [] },
]

[[tool.repository-governance.quality.cohorts]]
name = "portal"
kind = "logical-component"
paths = ["src/projektveckor_portal", "tests"]
test-targets = [
  "tests/test_exports_service_failed_export_retry.py",
  "tests/test_sir_convert_a_lot_v2_client_retry.py",
]
typecheck = "root-typecheck"
test = "root-test"

[[tool.repository-governance.quality.cohorts]]
name = "scripts"
kind = "path"
path = "scripts"
test-target = "none"
typecheck = "root-typecheck"

[tool.pdm.scripts]
# repository-governance:bindings:start
setup = "/usr/bin/env -u PYTHONPATH -u PEP582_PACKAGES pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-bootstrap --repo-root ${PDM_PROJECT_ROOT}"
new-worktree = "/usr/bin/env -u PYTHONPATH -u PEP582_PACKAGES pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-create --repo-root ${PDM_PROJECT_ROOT}"
format = "repository-governance-routine format --repo-root ${PDM_PROJECT_ROOT}"
lint = "repository-governance-routine lint --repo-root ${PDM_PROJECT_ROOT}"
typecheck = "repository-governance-routine typecheck --repo-root ${PDM_PROJECT_ROOT}"
test = "repository-governance-routine test --repo-root ${PDM_PROJECT_ROOT}"
check = "repository-governance-routine check --repo-root ${PDM_PROJECT_ROOT}"
new-doc = "repository-governance-new-doc"
new-epic = "new-epic"
new-story = "new-story"
new-task = "new-task"
new-review = "new-review"
docs-validate = "repository-governance-docs-validate"
format-md = "format-md"
check-md = "check-md"
format-md-all = "format-md-all"
check-md-all = "check-md-all"
# repository-governance:bindings:end
# repository-governance:auxiliary-bindings:start
archive-documents = "repository-governance-archive-documents"
markdownlint-config-sync = "markdownlint-config-sync"
markdownlint-config-drift-check = "markdownlint-config-drift-check"
staleness-audit = "repository-governance-staleness-audit --repo-root ${PDM_PROJECT_ROOT}"
publish-main = "repository-governance-publish-main --repository-root ${PDM_PROJECT_ROOT}"
verify-main-publication = "repository-governance-verify-main-publication --repository-root ${PDM_PROJECT_ROOT}"
# repository-governance:auxiliary-bindings:end
dev = "uvicorn projektveckor_portal.app:app --host 127.0.0.1 --port 8000 --reload"
"dev:lan" = "uvicorn projektveckor_portal.app:app --host 0.0.0.0 --port 8000 --reload"
serve = "uvicorn projektveckor_portal.app:app --host 127.0.0.1 --port 8000"
"serve:lan" = "uvicorn projektveckor_portal.app:app --host 0.0.0.0 --port 8000"
typecheck-producer = "mypy --config-file ${PDM_PROJECT_ROOT}/pyproject.toml"
test-producer = "pytest -c ${PDM_PROJECT_ROOT}/pyproject.toml -q"
skills-validate = "repository-governance-skills-validate"
handoff-validate = "repository-governance-handoff-validate"
precommit-install = "/usr/bin/env -u PYTHONPATH -u PEP582_PACKAGES pdm run --project ${HOME}/.codex/repository-governance-runtime repository-governance-hooks-install --repo-root ${PDM_PROJECT_ROOT}"

# Markdown quality (Docforge-style: prettier + markdownlint-cli2)
"lint:md" = "python -m scripts.maintenance.markdown_quality lint"
"fix:md" = "python -m scripts.maintenance.markdown_quality fix"
"format:md" = "python -m scripts.maintenance.markdown_quality format"
"check:md" = "python -m scripts.maintenance.markdown_quality check"
"autofix:md" = "python -m scripts.maintenance.markdown_quality autofix"

# Frontend (run from repo root; Skriptoteket-style)
"frontend:install" = "pnpm -C frontend install"
"frontend:dev" = "pnpm -C frontend dev"
"frontend:dev:lan" = "pnpm -C frontend dev:lan"
"frontend:build" = "pnpm -C frontend build"
"frontend:preview" = "pnpm -C frontend preview"
"frontend:preview:lan" = "pnpm -C frontend preview:lan"
"frontend:typecheck" = "pnpm -C frontend typecheck"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "frontend/node_modules",
  "frontend/dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
exclude = ["frontend/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
